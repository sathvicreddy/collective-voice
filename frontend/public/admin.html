<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="CollectiveVoice Admin Panel">
    <meta name="theme-color" content="#5b34ff">
    <title>Admin Panel — CollectiveVoice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin/index.css">
    <style>
      /* Isolated boot overlay — all styles inline to avoid admin CSS interference */
      #cv-admin-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fc;
        font-family: Inter, system-ui, sans-serif;
        flex-direction: column;
        gap: 14px;
      }
      #cv-admin-boot-logo {
        width: 52px !important;
        height: 52px !important;
        min-width: 52px;
        max-width: 52px;
        min-height: 52px;
        max-height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #5b34ff, #8a67ff);
        display: flex !important;
        align-items: center;
        justify-content: center;
        font-size: 22px !important;
        font-weight: 900;
        color: #fff;
        letter-spacing: -1px;
        line-height: 1;
        flex-shrink: 0;
        overflow: hidden;
      }
      #cv-admin-boot-msg {
        font-size: 13px;
        color: #888;
        letter-spacing: 0.02em;
        margin: 0;
        padding: 0;
      }
      #cv-admin-boot.hidden { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Boot overlay shown while JS module loads -->
    <div id="cv-admin-boot">
      <div id="cv-admin-boot-logo">CV</div>
      <div id="cv-admin-boot-msg">Loading Admin Panel…</div>
    </div>

    <!-- Admin app root (hidden until JS renders into it) -->
    <div id="admin-app"></div>

    <!-- Version token injected by server to bust ES module cache on every restart -->
    <script>window.__CV_VERSION__ = '<!--CV_VERSION-->';</script>
    <script type="module">
      const v = window.__CV_VERSION__ || Date.now();
      import(`/js/admin/app.js?v=${v}`)
        .catch(err => {
          console.error('[Admin] Module load failed:', err);
          const msg = document.getElementById('cv-admin-boot-msg');
          if (msg) {
            msg.textContent = 'Failed to load — please press Ctrl+Shift+R';
            msg.style.color = '#e54040';
          }
        });
    </script>
  </body>
</html>
